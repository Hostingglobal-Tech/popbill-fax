[package]
name = "popbill-fax"
version = "0.1.0"
edition = "2024"
description = "Popbill Linkhub FAX CLI in Rust"

[[bin]]
name = "popbill-fax"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "deflate", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
