# Popbill FAX configuration template.
# Copy to config.toml or ~/.config/popbill-fax/config.toml.
# Do not commit real secret values.

link_id = "<LINKHUB LinkID>"
secret_key = "<LINKHUB SecretKey base64>"
corp_num = "1234567890"
user_id = "your-popbill-user-id"
is_test = false

ip_restrict = true
use_static_ip = false
use_local_time = true
use_ga_ip = false

# Optional local approval server. Actual fax send waits for allow.
approval_url = "http://127.0.0.1:5510"
approval_timeout_secs = 600

# Optional physical siren status page.
# If set, actual fax send waits until approvalPending/siren becomes true.
siren_status_url = ""
siren_wait_secs = 12
